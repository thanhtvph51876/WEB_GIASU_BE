server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tutor-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutor_platform?options=-c%20TimeZone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:thanhvan1509}
    password: ${SPRING_DATASOURCE_PASSWORD:thanhvan1509}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:60}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/api/v1/files}
  payment:
    mode: ${PAYMENT_MODE:mock}
    enabled-gateways: ${ENABLED_GATEWAYS:mock,bank_qr,vnpay,momo,payos,stripe}
    default-gateway: ${DEFAULT_GATEWAY:mock}
    timeout-minutes: ${PAYMENT_TIMEOUT_MINUTES:30}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
  commission-rate: ${COMMISSION_RATE:0.15}
