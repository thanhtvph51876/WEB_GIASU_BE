server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tutor-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutor_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:60}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/api/v1/files}
  payment:
    mode: ${PAYMENT_MODE:sandbox}
    enabled-gateways: ${ENABLED_GATEWAYS:bank_qr,vnpay,momo,payos,stripe}
    default-gateway: ${DEFAULT_GATEWAY:bank_qr}
    timeout-minutes: ${PAYMENT_TIMEOUT_MINUTES:30}
  auth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    password-reset-token-expire-minutes: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:30}
    email-verification-token-expire-minutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES:1440}
    expose-dev-tokens: ${AUTH_EXPOSE_DEV_TOKENS:false}
  commission-rate: ${COMMISSION_RATE:0.15}
